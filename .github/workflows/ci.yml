name: ci
on:
  push:
  pull_request:

jobs:
  portable-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Quality
        run: python scripts/quality_check.py
      - name: Pedagogy (Days 01-06)
        run: |
          python scripts/pedagogy_check_unified.py --day 2026-09-03
          python scripts/pedagogy_check_unified.py --day 2026-09-04
          python scripts/pedagogy_check_unified.py --day 2026-09-05
          python scripts/pedagogy_check_unified.py --day 2026-09-06
      - name: Day module tests (solutions)
        run: |
          python scripts/run_day_tests.py --day 2026-09-03 --mode solutions
          python scripts/run_day_tests.py --day 2026-09-04 --mode solutions
          python scripts/run_day_tests.py --day 2026-09-05 --mode solutions
          python scripts/run_day_tests.py --day 2026-09-06 --mode solutions
      - name: Build and test
        run: python scripts/run_all_tests.py

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Quality
        run: python scripts/quality_check.py
      - name: Build and test with Visual Studio generator
        shell: pwsh
        run: |
          $projects = @('chris-vm','chris-autograd','chris-disassembler','chris-binary-toolkit','chris-renderer','chris-lantern-hunt','chris-compress','chris-assembly-lab','chris-cpu','chris-nasm','chris-boot','chris-terminal','chris-http','chris-p2p','chris-chain','chris-driver-lab')
          foreach ($p in $projects) {
            if ($p -eq 'chris-lantern-hunt') {
              python "projects/$p/tools/generate_assets.py"
            }
            cmake -S "projects/$p" -B "build/$p" -A x64
            cmake --build "build/$p" --config Release
            ctest --test-dir "build/$p" -C Release --output-on-failure
          }
