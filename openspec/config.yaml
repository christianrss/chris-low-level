# OpenSpec project config — low-level-unified-portfolio
# Install CLI: npm i -g @fission-ai/openspec  (then: openspec init --tools cursor)
# This tree was scaffolded manually to match OpenSpec layout.

context: |
  Repositório de laboratórios low-level em days/YYYY-MM-DD/<trilha>/<modulo>/.
  Formato principal: Markdown modular (PEDAGOGY_STANDARD.md). DOCX é export opcional.

  Dias até 2026-09-11 são acervo legado e mantêm seus contratos.
  Novos dias usam o perfil depth_first:
  - exatamente 1 projeto autêntico de 6–8 horas
  - starter quase vazio; núcleo construído pelo aluno
  - cobertura de lanes por ciclo de 7–10 dias
  - Infra sincronizada: README, START_HERE, ATIVIDADES, TODO_MAP, VALIDATION, MANIFEST
  - ASSESSMENT.yaml e RUBRIC.md com evidência mensurável
  - Cada projeto atualiza docs/LEARNING_PATHS.md e scripts/module_project_map.py

  Antes de scaffold:
  1. Ler openspec/specs/day-contract/ e selecionar primary_lane + cycle
  2. Confirmar 6–10 marcos, ≥250 SLOC de autoria, testes adversos e benchmark
  3. Não marcar done só com pedagogy_check — validar starter, solution e ciclo

  Proibido: generate_day_scaffold.py sem --manifest-only em dias já curados (START_HERE/TODO_MAP).
  Proibido: scripts batch para fabricar teoria, resolução ou exercícios de novos dias.

rules:
  proposal:
    - Incluir exatamente um projeto, planned_hours, primary_lane e cycle
    - Declarar trabalho student_owned e critérios de aceite
    - Mencionar gates: pedagogy, day contract, starter, solutions e cycle
  design:
    - Mapear cada projeto novo para lane, LEARNING_PATHS e module_project_map
  tasks:
    - Última task sempre: validar gates e sincronizar infra do dia

operations:
  apply:
    - Após cada marco, rodar testes focados; ao final, todos os gates
    - Não sobrescrever START_HERE.md / TODO_MAP.md com template genérico
  archive:
    - Mesclar delta specs em openspec/specs/
    - Mover change para openspec/changes/archive/YYYY-MM-DD-slug/
